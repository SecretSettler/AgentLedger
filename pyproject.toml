[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentledger"
dynamic = ["version"]
description = "Agent reports you can review: modular, versioned, commented on any line, and answered by the agent session that wrote them."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
agentledger = "agentledger.cli:main"

[tool.setuptools]
packages = ["agentledger"]

[tool.setuptools.package-data]
agentledger = ["assets/*", "demo/*"]

[tool.setuptools.dynamic]
version = { attr = "agentledger.__version__" }
